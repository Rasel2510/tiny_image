name: tinyimg
description: A minimal, modern offline image compression app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Image compression
  flutter_image_compress: ^2.3.0

  # Image picking from gallery / camera
  image_picker: ^1.1.2

  # Temporary & app directory access
  path_provider: ^2.1.4

  # Share compressed files to other apps
  share_plus: ^10.1.4

  # Runtime permissions (storage, photos)
  permission_handler: ^11.3.1

  # Save to device gallery
  gal: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
